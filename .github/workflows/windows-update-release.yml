name: Package Windows update
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.RELEASE_TAG) throw Error('Tag must match package.json version');"
      - run: npm ci
      - run: node --test scripts/updater/core.test.mjs scripts/updater/extract.test.mjs
      - run: node --test scripts/updater/worker.test.mjs
      - run: npm test -- --runInBand src/__tests__/updates.spec.ts
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          NEXTAUTH_SECRET: build-only-not-a-production-secret-123456789
          NEXTAUTH_URL: http://localhost:3000
      - name: Package tracked source
        run: git archive --format=zip --output=ascit-windows-source.zip HEAD
      - name: Attach verified package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" ascit-windows-source.zip
